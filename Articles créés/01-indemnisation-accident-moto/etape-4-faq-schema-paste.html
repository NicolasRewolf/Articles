<script>{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Quel est le délai pour être indemnisé après un accident de moto ?","acceptedAnswer":{"@type":"Answer","text":"L'assureur doit présenter une offre d'indemnisation dans les 8 mois suivant l'accident (article 12 de la loi Badinter), ou dans les 5 mois suivant la consolidation médicale si elle est plus tardive. Un dépassement entraîne le doublement du taux d'intérêt légal sur les sommes dues (article 16 de la loi Badinter, codifié à l'article L. 211-13 du Code des assurances)."}},{"@type":"Question","name":"L'assureur peut-il refuser de m'indemniser si j'ai commis une faute à moto ?","acceptedAnswer":{"@type":"Answer","text":"Oui, en partie. L'article 4 de la loi Badinter permet à l'assureur d'opposer la faute du conducteur de véhicule terrestre à moteur. Une faute simple peut limiter votre indemnisation. L'évaluation se fait au cas par cas, en fonction de la gravité de la faute et de son lien de causalité avec le dommage. Un avocat évalue si la faute invoquée est juridiquement opposable."}},{"@type":"Question","name":"Comment est calculée l'indemnisation du préjudice d'agrément pour un motard ?","acceptedAnswer":{"@type":"Answer","text":"Le préjudice d'agrément indemnise la perte de la capacité à pratiquer la moto comme activité de loisir. Il faut prouver une pratique antérieure régulière (licence, photos, témoignages, factures d'équipement). Le montant dépend de l'intensité de la pratique, de l'âge, et du caractère définitif de la perte. La jurisprudence retient des fourchettes indicatives entre 5 000 € et 50 000 € selon ces critères, voire au-delà pour les cas de perte totale (motard passionné qui ne peut plus jamais remonter en selle)."}},{"@type":"Question","name":"Mon équipement moto détruit (casque, blouson) est-il indemnisé ?","acceptedAnswer":{"@type":"Answer","text":"Oui. L'équipement détruit dans l'accident relève des dommages aux biens (article 5 de la loi Badinter) et se réclame sous le poste « préjudice vestimentaire » de la nomenclature Dintilhac. Casque homologué, blouson airbag, bottes et gants techniques sont indemnisables sur présentation des factures d'achat. Conservez systématiquement photos avant/après et tickets de caisse. Le casque doit en outre être obligatoirement détruit après tout choc."}},{"@type":"Question","name":"Que faire si l'auteur de mon accident a pris la fuite ou n'est pas assuré ?","acceptedAnswer":{"@type":"Answer","text":"Vous pouvez saisir le Fonds de Garantie des Assurances Obligatoires (FGAO), qui indemnise les victimes lorsque le responsable est non identifié, non assuré, ou en fuite. Si l'accident résulte d'un délit pénal (délit de fuite, conduite sous stupéfiants, refus de priorité avec ITT supérieure à 8 jours), la CIVI peut également être saisie en complément."}},{"@type":"Question","name":"Faut-il un avocat pour être indemnisé après un accident de moto ?","acceptedAnswer":{"@type":"Answer","text":"Ce n'est pas obligatoire, mais l'écart entre l'offre initiale de l'assureur et le montant final obtenu avec un avocat est souvent significatif. Une analyse jurimétrique Themia de janvier 2025, portant sur 3 500 décisions judiciaires, mesure un écart moyen de 30 à 50 % entre les offres amiables et les décisions judiciaires. Les victimes accompagnées par un avocat obtiennent en moyenne 2 à 3 fois plus d'indemnisation. Un premier rendez-vous d'information ne vous engage à rien."}}]}</script>
